name: Daily scraper trigger

# GitHub Actions' scheduler isn't subject to Vercel's Hobby-plan Cron Jobs
# restrictions, so this stays the trigger mechanism even at daily cadence —
# it's what calls the backend's secured cron endpoint on a real,
# guaranteed-to-run schedule (the in-process node-cron timer in
# backend/src/index.ts only fires while that serverless instance happens to
# stay warm, which Vercel doesn't guarantee; confirmed in production as
# 5+ weeks with zero new articles before this workflow was added).

on:
  schedule:
    - cron: '0 6 * * *' # once daily, 06:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button for on-demand triggers

jobs:
  trigger-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/scraper
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "https://ai-pulse-newsletter.vercel.app/api/cron/scraper" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 400 ]; then
            echo "::error::Scraper trigger failed with status $status"
            exit 1
          fi
