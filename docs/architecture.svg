<text class="th purple-t" x="340" y="176" text-anchor="middle" dominant-baseline="central">Vercel</text>
<text class="ts purple-s" x="340" y="194" text-anchor="middle" dominant-baseline="central">Un deployment, dos servicios, mismo origen</text>

<rect x="60" y="212" width="255" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
