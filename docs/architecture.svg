<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="title desc">
<title id="title">AI Pulse architecture</title>
<desc id="desc">A single Vercel deployment holds two services sharing one origin: a Vite + Nitro frontend doing SSR and ISR, and an Express + Prisma backend. The frontend calls the backend API; the backend depends on three external services — Neon Postgres with pgvector, Upstash Redis, and Google Gemini. Visitors enter through the frontend; the GitHub Actions cron and MCP clients enter through the backend.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .gray-t { fill: #444441; } .gray-s { fill: #5F5E5A; }
  .purple-t { fill: #3C3489; } .purple-s { fill: #534AB7; }
  .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
  .coral-t { fill: #712B13; } .coral-s { fill: #993C1D; }
  .muted { fill: #888780; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

