<text class="ts gray-s" x="393" y="66" text-anchor="middle" dominant-baseline="central">Cron diario</text>

<rect x="488" y="30" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="563" y="48" text-anchor="middle" dominant-baseline="central">Cliente MCP</text>
<text class="ts gray-s" x="563" y="66" text-anchor="middle" dominant-baseline="central">Claude, Cursor</text>

