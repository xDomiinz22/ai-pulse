<text class="ts gray-s" x="340" y="430" text-anchor="middle" dominant-baseline="central">Caché, trending</text>

<rect x="450" y="394" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="535" y="412" text-anchor="middle" dominant-baseline="central">Google Gemini</text>
<text class="ts gray-s" x="535" y="430" text-anchor="middle" dominant-baseline="central">Scraper y chat</text>
